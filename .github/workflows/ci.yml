name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["22.18.0", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install secret scanner
        run: |
          mkdir -p "$RUNNER_TEMP/umail-gitleaks"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/umail-gitleaks/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/umail-gitleaks/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/umail-gitleaks/gitleaks.tar.gz" -C "$RUNNER_TEMP/umail-gitleaks" gitleaks
      - name: Scan source snapshot
        run: '"$RUNNER_TEMP/umail-gitleaks/gitleaks" dir . --redact --no-banner'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:e2e:local
      - run: pnpm build:clients
      - name: Scan CLI artifact
        run: '"$RUNNER_TEMP/umail-gitleaks/gitleaks" dir dist/clients --redact --no-banner'
