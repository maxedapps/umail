packages:
  - apps/*
  - packages/*
# Off so pnpm reruns @playwright/browser-chromium's download when the browser is gone; `exclude` needs pnpm 12.14.
sideEffectsCache: false
allowBuilds:
  "@playwright/browser-chromium": true
  workerd: true
  esbuild: true
  msgpackr-extract: false
  sharp: false
minimumReleaseAgeExclude:
  - "@types/node@24.19.2"
  - "@effect/tsgo-darwin-arm64@0.67.1"
  - "@effect/tsgo-darwin-x64@0.67.1"
  - "@effect/tsgo-linux-arm64@0.67.1"
  - "@effect/tsgo-linux-arm@0.67.1"
  - "@effect/tsgo-linux-x64@0.67.1"
  - "@effect/tsgo-win32-arm64@0.67.1"
  - "@effect/tsgo-win32-x64@0.67.1"
  - "@effect/tsgo@0.67.1"
overrides:
  "@better-auth/oauth-provider": 1.7.7
  "@cloudflare/workers-types": 5.20261026.1
patchedDependencies:
  "@better-auth/oauth-provider@1.7.7": patches/@better-auth__oauth-provider@1.7.7.patch
  postal-mime@4.0.5: patches/postal-mime@4.0.5.patch
